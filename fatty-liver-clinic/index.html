  function derive(code) {
    return S.importKey('raw', enc.encode(String(code).toUpperCase().replace(/[\s-]+/g, '')), 'PBKDF2', false, ['deriveBits']).then(function (b) {
      return S.deriveBits({ name: 'PBKDF2', salt: enc.encode(LOCKED.salt), iterations: LOCKED.iter, hash: 'SHA-256' }, b, 256);
    });
  }
  function openApp(raw) {
    return S.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function (k) {
      return S.decrypt({ name: 'AES-GCM', iv: unb64(LOCKED.iv) }, k, unb64(LOCKED.data));
    }).then(function (plain) { var html = new TextDecoder().decode(plain); document.open(); document.write(html); document.close(); setTimeout(function () { window.dispatchEvent(new Event('flc-start')); }, 0); });
  }
  var gate = document.getElementById('gate'), msg = document.getElementById('msg'), go = document.getElementById('go');
  function ask(note) { gate.hidden = false; msg.textContent = note || ''; document.getElementById('code').focus(); }
  gate.onsubmit = function (e) {
    e.preventDefault(); go.disabled = true; msg.textContent = 'Checking\u2026';
    var raw;
    derive(document.getElementById('code').value).then(function (r) { raw = r; return openAppTest(raw); })
      .then(function () { return kv('readwrite', function (o) { return o.put(new Uint8Array(raw), 'key'); }); })
      .then(function () { return openApp(raw); })
      .catch(function () { go.disabled = false; msg.textContent = 'This access code is not correct.'; });
  };
  /* check the code without replacing the page yet */
  function openAppTest(raw) { return S.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function (k) { return S.decrypt({ name: 'AES-GCM', iv: unb64(LOCKED.iv) }, k, unb64(LOCKED.data)); }); }
  kv('readonly', function (o) { return o.get('key'); }).then(function (raw) {
    if (!raw) return ask();
    return openApp(raw).catch(function () { ask('The access code has changed. Please enter the new code.'); });
  }).catch(function () { ask(); });
})();
</script>
</body>
